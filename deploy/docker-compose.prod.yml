name: netscope-prod

services:
  # Internal PostgreSQL Database (Not exposed to the public internet)
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netscope_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: netscope_prod
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netscope_admin} -d netscope_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Internal Redis Coordination Broker (Not exposed to the public internet)
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Central Coordinator & Management API (Node.js production mode)
  coordinator:
    build:
      context: ../Backend
      dockerfile: Dockerfile
    restart: always
    command: ["npm", "run", "start:prod"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-netscope_admin}:${POSTGRES_PASSWORD}@postgres:5432/netscope_prod?schema=public
      - REDIS_URL=redis://redis:6379
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      - ALLOW_PRIVATE_LAB_NETWORKS=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend Nginx Reverse Proxy (Serves built React assets and proxies /api/ to coordinator)
  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - coordinator

volumes:
  postgres_prod_data:
  redis_prod_data:
